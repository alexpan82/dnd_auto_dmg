[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd_auto_dmg"
version = "0.1.0"
description = "D&D auto-damage calculation agent."
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langgraph-prebuilt",
    "langgraph-sdk",
    "langgraph-checkpoint-sqlite",
    "langsmith",
    "langchain-community",
    "langchain-core",
    "langchain==0.3.27",
    "langchain-openai",
    "langgraph-cli[inmem]",
    "pyaudio",
    "numpy",
    "chainlit",
    "rapidfuzz",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dnd_auto_dmg*"]
